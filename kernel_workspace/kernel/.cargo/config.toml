[unstable]
json-target-spec = true
build-std-features = ["compiler-builtins-mem"]
# Globally build `core`/`compiler_builtins`/`alloc` from source — the custom
# JSON kernel targets (x86_64-kernel / riscv64-kernel) have no preinstalled
# std, so this is required for `cargo build --target ...-kernel.json`.
build-std = ["core", "compiler_builtins", "alloc", "panic_abort"]

[build]
target = "x86_64-kernel.json"

[target.'cfg(target_os = "none")']
runner = "bootimage runner"
