[package]
name = "driverspace"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "driverspace"
path = "src/main.rs"
# Bare-metal (`x86_64-unknown-none`) nie ma `std` ani crate'a `test` —
# wyłączamy target testowy, zeby `cargo check --tests` nie zwracal E0463.
test = false

[dependencies]
driverspacelib = { path = "../driverspacelib" }

[profile.release]
panic = "abort"
opt-level = 2

[profile.dev]
panic = "abort"