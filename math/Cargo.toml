[workspace]
resolver = "2"
members = [
    "crates/math-core",
]

# The math stack must never pull `std` into a kernel or a driver. Deny it at the
# workspace level rather than trusting every member to remember.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
arithmetic_side_effects = "allow"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
