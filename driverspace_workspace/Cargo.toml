[workspace]
resolver = "2"
members = [
    "crates/ds-detect",
    "crates/ds-manager",
    "crates/ds-registry",
    "drivers/Alsa-TrangorgeOS",
    "drivers/audiodriver",
    "drivers/IntelGpu-TrangorgeOS",
    "drivers/AmdGpu-TrangorgeOS",
    # `drivers/iommu-TrangorgeOS` is an empty directory: the crate was never
    # committed, so it is not a member. `tools/mkdriverimg.sh` still tries to
    # build `iommu-driver` and has to stop doing that too. Unrelated to the
    # graphics chain, so it is recorded here rather than invented.
    # "drivers/iommu-TrangorgeOS",
    "drivers/netcam_driver",
    "drivers/vgpu",
    "drivers/wacomgraphic_driver",
    "lib/ds-formal-ffi",
    "lib/ds-fw-audio",
    "lib/ds-fw-block",
    "lib/ds-fw-gpu",
    "lib/ds-fw-input",
    "lib/ds-fw-iommu",
    "lib/ds-fw-power",
    "lib/ds-fw-video",
    "lib/ds-ipc",
    "lib/ds-log",
    "lib/ds-mem",
    "lib/kapi-abi",
    "lib/kapi-syscall",
]

[profile.release]
panic = "abort"
opt-level = 2

[profile.dev]
panic = "abort"
