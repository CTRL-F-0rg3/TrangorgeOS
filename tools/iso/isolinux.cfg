# TrangorgeOS demo ISO — ISOLINUX configuration.
#
# ISOLINUX resolves paths relative to this directory (/isolinux); a leading "/"
# means "from the ISO root".  Plain ISO9660 names only (no Rock Ridge/Joliet),
# which is why the payload lives in /boot with a <=31 character name.
#
# See tools/mkiso.sh for how the ISO is produced and tools/iso/README.md for the
# rationale behind ISOLINUX + MEMDISK.

DEFAULT trangorge
PROMPT 0
TIMEOUT 30

SAY TrangorgeOS @VERSION@ — bare-metal demo image (BIOS)

LABEL trangorge
    MENU LABEL TrangorgeOS @VERSION@ (BIOS, recommended)
    # MEMDISK boots the unmodified bootloader-0.9 raw image from RAM, so the CD
    # is only the carrier: no 512/2048-byte sector mismatch is possible.
    KERNEL memdisk
    INITRD /boot/trangorge.img
    # The image is just under MEMDISK's 4 MiB floppy/hard-disk threshold, so
    # "harddisk" forces hard-disk emulation explicitly instead of relying on
    # size/partition-table guessing.
    APPEND harddisk

LABEL trangorge-floppy
    MENU LABEL TrangorgeOS @VERSION@ (MEMDISK, floppy emulation debug)
    # Fallback label: forces floppy-style geometry. Only useful for debugging
    # MEMDISK geometry problems on exotic BIOSes.
    KERNEL memdisk
    INITRD /boot/trangorge.img
    APPEND floppy

LABEL harddisk
    MENU LABEL Boot from first hard disk
    LOCALBOOT 0x80
