[package]
name = "driverspacelib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]
# Bare-metal (`x86_64-unknown-none`) nie ma crate'a `test` — wyłączamy
# target testowy, zeby `cargo check --tests` nie zwracal bledu E0463.
test = false

[dependencies]

[profile.release]
panic = "abort"
opt-level = 2

[profile.dev]
panic = "abort"