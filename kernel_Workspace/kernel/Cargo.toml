[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[lib]
name = "kernel"
path = "src/main.rs" # Lub przenieś główny kod wejściowy do src/lib.rs

[features]
default = []
policy-foreign = []

[dependencies]
volatile = "0.2.6"
spin = "0.5.2"
bitflags = "2.4"
lazy_static = { version = "1.0", features = ["spin_no_std"] }

# Strict shared-memory communication protocol (independent library).
tg-comm = { path = "../../lib" }

# The driver-space ABI. The kernel is the kernel-side end of the graphics
# chain, so it has to speak the same `FramebufferDesc` the drivers and the
# display server do - otherwise the three layers each invent their own packing,
# which is exactly the drift this dependency removes.
kapi-abi = { path = "../../driverspace_workspace/lib/kapi-abi" }

# Zależności z core (jeśli kernel z nich korzysta):
kstd_core = { path = "../core/kstd_core" }
kstd_base = { path = "../core/kstd_base" }
gluecore = { path = "../core/gluecore" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory", "vga_320x200"] }
x86_64 = "0.15"
pic8259 = "0.10.1"

[package.metadata.bootimage]
build-command = ["build"]
run-command = ["qemu-system-x86_64", "-drive", "format=raw,file={}", "-drive", "format=raw,file=data.img,if=ide,index=1", "-device", "qemu-xhci", "-smp", "4", "-display", "gtk"]