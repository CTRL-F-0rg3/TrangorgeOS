[package]
name = "kernel-bin"
version = "0.1.0"
edition = "2021"

# The new foundations (DriverSpace / IPC glue) live in the library. It is
# linked into the binary below, so both are built together.
#
# NOTE: the crate-type must stay `rlib` (no `staticlib`): a staticlib is a final
# artifact, so rustc demands its own `#[panic_handler]` — and that clashes with
# the one in `kernel/src/arch/x86_64.rs`
# (`error[E0152]: duplicate lang item panic_impl`). The panic handler of the
# kernel is the single one of the image.
[lib]
name = "kernel_bin"
path = "src/lib.rs"
crate-type = ["rlib"]

# `cargo bootimage` builds a *binary* target and wraps it into
# `bootimage-kernel-bin.bin`. This crate is the only one allowed to define the
# bootloader `_start` (see src/main.rs).
[[bin]]
name = "kernel-bin"
path = "src/main.rs"

[dependencies]
# The legacy kernel is a dependency of this new entry layer.
kernel = { path = "../kernel" }

# Core foundations
kstd_base = { path = "../core/kstd_base" }
kstd_alloc = { path = "../core/kstd_alloc" }
kstd_core = { path = "../core/kstd_core" }
kstd_io = { path = "../core/kstd_io" }
gluecore = { path = "../core/gluecore" }

# DriverSpace libraries (konkretne crate'y, nie workspace)
kapi-abi = { path = "../../driverspace_workspace/lib/kapi-abi" }
kapi-syscall = { path = "../../driverspace_workspace/lib/kapi-syscall" }
ds-ipc = { path = "../../driverspace_workspace/lib/ds-ipc" }
ds-log = { path = "../../driverspace_workspace/lib/ds-log" }
ds-mem = { path = "../../driverspace_workspace/lib/ds-mem" }

# The binary target needs bootloader 0.9: it provides `entry_point!` (the
# `_start` symbol) and the linker script `cargo bootimage` links the image with.
# The kernel library has its own (identical) dependency for the BootInfo type.
[target.'cfg(target_arch = "x86_64")'.dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory", "vga_320x200"] }

[package.metadata.bootimage]
build-command = ["build"]
run-command = ["qemu-system-x86_64", "-drive", "format=raw,file={}", "-drive", "format=raw,file=data.img,if=ide,index=1", "-device", "qemu-xhci", "-smp", "4", "-display", "gtk"]
