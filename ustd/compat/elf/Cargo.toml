[package]
name = "tgs-elf"
description = "ELF64 parsing for the TrangorgeOS Linux compatibility layer."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tgs_elf"
crate-type = ["rlib"]
doctest = false

# Tests read real binaries from the host, so the test profile is std and not
# `no_std`. The library itself never is — that is the point of it.
[dependencies]

[[test]]
name = "real_binaries"
path = "tests/real_binaries.rs"
